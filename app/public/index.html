<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meeting Recorder</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --border: #262a33;
    --text: #e6e8ec;
    --muted: #8b93a5;
    --accent: #4c8bf5;
    --ok: #3ecf8e;
    --warn: #f5a524;
    --err: #f26969;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { margin: 0 0 4px; font-weight: 600; font-size: 24px; }
  .sub { color: var(--muted); margin-bottom: 28px; font-size: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 22px 26px;
    margin-bottom: 22px;
  }
  h2 { margin: 0 0 16px; font-size: 17px; font-weight: 600; }
  form { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
  input, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: white;
    border: 0;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.danger { background: transparent; color: var(--err); border: 1px solid rgba(242,105,105,0.4); padding: 6px 12px; font-size: 12px; border-radius: 6px; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); padding: 6px 12px; font-size: 12px; border-radius: 6px; }
  .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
  .msg.err { background: rgba(242,105,105,0.1); color: var(--err); border: 1px solid rgba(242,105,105,0.3); }
  .msg.ok { background: rgba(62,207,142,0.1); color: var(--ok); border: 1px solid rgba(62,207,142,0.3); }

  /* Section headers */
  .section-hdr {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 6px;
  }
  .section-hdr h2 { margin: 0; }
  .count-badge {
    background: var(--border);
    color: var(--muted);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 9px;
  }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }

  /* Recording rows */
  .row {
    border-top: 1px solid var(--border);
    padding: 16px 0;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .row:first-of-type { border-top: 0; padding-top: 4px; }
  .row-main { flex: 1; min-width: 220px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .rec-label { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
  .rec-meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: var(--border);
    color: var(--muted);
    margin-right: 4px;
  }
  .pill.recording { background: rgba(242,105,105,0.2); color: var(--err); }
  .pill.scheduled, .pill.ready, .pill.joining_call { background: rgba(76,139,245,0.2); color: var(--accent); }
  .pill.done, .pill.completed, .pill.call_ended { background: rgba(62,207,142,0.2); color: var(--ok); }
  .pill.failed, .pill.fatal, .pill.lookup_failed { background: rgba(245,165,36,0.2); color: var(--warn); }
  .pill.uploading { background: rgba(245,165,36,0.15); color: var(--warn); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }

  .drive-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--ok);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 12px;
    border: 1px solid rgba(62,207,142,0.35);
    border-radius: 6px;
    background: rgba(62,207,142,0.08);
  }
  .drive-link:hover { background: rgba(62,207,142,0.15); }

  .empty { color: var(--muted); padding: 24px 0; text-align: center; font-size: 14px; }
  a { color: var(--accent); }

  .divider { border: 0; border-top: 1px solid var(--border); margin: 6px 0 18px; }
</style>
</head>
<body>
<div class="container">

  <h1>🎥 Meeting Recorder</h1>
  <div class="sub">Schedule unattended Recall.ai bots to record Zoom, Meet, or Teams meetings. Completed recordings upload automatically to Google Drive.</div>

  <!-- Schedule Form -->
  <div class="card">
    <h2>Schedule a Recording</h2>
    <div id="form-msg"></div>
    <form id="form">
      <div class="full">
        <label for="url">Meeting URL</label>
        <input id="url" type="url" placeholder="https://zoom.us/j/..." required />
      </div>
      <div class="full">
        <label for="label">Label (optional)</label>
        <input id="label" type="text" placeholder="e.g. Sunday service" />
      </div>
      <div>
        <label for="start">Start (your local time)</label>
        <input id="start" type="datetime-local" required />
      </div>
      <div>
        <label for="stop">Stop (your local time)</label>
        <input id="stop" type="datetime-local" required />
      </div>
      <div class="full">
        <button type="submit" id="submit">Schedule Recording</button>
      </div>
    </form>
  </div>

  <!-- Scheduled Recordings -->
  <div class="card">
    <div class="toolbar">
      <div class="section-hdr">
        <h2>📅 Scheduled Recordings</h2>
        <span class="count-badge" id="upcoming-count">–</span>
      </div>
      <button class="ghost" onclick="refresh()">↻ Refresh</button>
    </div>
    <div id="upcoming-list"><div class="empty">Loading…</div></div>
  </div>

  <!-- Past Recordings -->
  <div class="card">
    <div class="section-hdr" style="margin-bottom:16px">
      <h2>🕘 Past Recordings</h2>
      <span class="count-badge" id="past-count">–</span>
    </div>
    <div id="past-list"><div class="empty">Loading…</div></div>
  </div>

</div>

<script>
const form = document.getElementById("form");
const formMsg = document.getElementById("form-msg");
const submit = document.getElementById("submit");

// Pre-fill: tomorrow 10am → 7pm local
(function prefill() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  d.setHours(10, 0, 0, 0);
  const s = new Date(d);
  s.setHours(19, 0, 0, 0);
  const fmt = (dt) => {
    const p = (n) => String(n).padStart(2, "0");
    return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}T${p(dt.getHours())}:${p(dt.getMinutes())}`;
  };
  document.getElementById("start").value = fmt(d);
  document.getElementById("stop").value = fmt(s);
})();

function showMsg(type, text) {
  formMsg.innerHTML = `<div class="msg ${type}">${text}</div>`;
  if (type === "ok") setTimeout(() => (formMsg.innerHTML = ""), 6000);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  formMsg.innerHTML = "";
  submit.disabled = true;
  submit.textContent = "Scheduling…";

  const start_at = new Date(document.getElementById("start").value).toISOString();
  const stop_at  = new Date(document.getElementById("stop").value).toISOString();
  const meeting_url = document.getElementById("url").value.trim();
  const label = document.getElementById("label").value.trim();

  try {
    const res = await fetch("/api/recordings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ meeting_url, start_at, stop_at, label }),
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg("err", data.error || "Failed to schedule");
    } else {
      showMsg("ok", `✓ Scheduled — Bot ID: ${data.bot_id}. The bot will join at the scheduled time.`);
      form.reset();
      refresh();
    }
  } catch (err) {
    showMsg("err", err.message);
  } finally {
    submit.disabled = false;
    submit.textContent = "Schedule Recording";
  }
});

function fmtLocal(iso) {
  if (!iso) return "—";
  try {
    return new Date(iso).toLocaleString(undefined, {
      weekday: "short", month: "short", day: "numeric",
      hour: "numeric", minute: "2-digit",
    });
  } catch { return iso; }
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function refresh() {
  const upEl   = document.getElementById("upcoming-list");
  const pastEl = document.getElementById("past-list");
  upEl.innerHTML = `<div class="empty">Loading…</div>`;
  pastEl.innerHTML = `<div class="empty">Loading…</div>`;

  try {
    const res = await fetch("/api/recordings");
    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const data = await res.json();
    const upcoming = data.upcoming || [];
    const past     = data.past     || [];

    document.getElementById("upcoming-count").textContent = upcoming.length;
    document.getElementById("past-count").textContent     = past.length;

    upEl.innerHTML   = upcoming.length ? upcoming.map(renderScheduled).join("") : `<div class="empty">No scheduled recordings.</div>`;
    pastEl.innerHTML = past.length     ? past.map(renderPast).join("")           : `<div class="empty">No past recordings yet.</div>`;
  } catch (err) {
    upEl.innerHTML   = `<div class="msg err">${err.message}</div>`;
    pastEl.innerHTML = "";
  }
}

function renderScheduled(r) {
  const status = r.status || "scheduled";
  const cls    = status.toLowerCase().replace(/[^a-z]/g, "_");
  const isLive = ["joining_call", "in_call_not_recording", "in_call_recording", "recording"].includes(status);

  return `
    <div class="row" id="row-${r.bot_id}">
      <div class="row-main">
        <div class="rec-label">${escapeHtml(r.label)}</div>
        <div class="rec-meta">
          ${fmtLocal(r.start_at)} → ${fmtLocal(r.stop_at)}
        </div>
        <span class="pill ${cls}">${isLive ? "🔴 " : ""}${status}</span>
      </div>
      <div class="row-actions">
        <button class="danger" onclick="cancelBot('${r.bot_id}')">Cancel</button>
      </div>
    </div>`;
}

function renderPast(r) {
  const status = r.status || "done";
  const cls    = status.toLowerCase().replace(/[^a-z]/g, "_");

  let driveHtml = "";
  if (r.drive_link) {
    driveHtml = `<a class="drive-link" href="${escapeHtml(r.drive_link)}" target="_blank" rel="noopener">
      📂 Open in Google Drive
    </a>`;
    if (r.transcript_link) {
      driveHtml += ` <a class="ghost" style="font-size:12px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;color:var(--muted);text-decoration:none;" href="${escapeHtml(r.transcript_link)}" target="_blank">Transcript</a>`;
    }
  } else if (["done","completed","call_ended"].includes(status)) {
    // Auto-trigger upload and show uploading state
    driveHtml = `<span class="pill uploading" id="uploading-${r.bot_id}">⏫ Uploading to Drive…</span>`;
    setTimeout(() => autoUpload(r.bot_id), 100);
  } else {
    driveHtml = `<span class="pill ${cls}">${status}</span>`;
  }

  return `
    <div class="row" id="row-${r.bot_id}">
      <div class="row-main">
        <div class="rec-label">${escapeHtml(r.label)}</div>
        <div class="rec-meta">${fmtLocal(r.start_at)} → ${fmtLocal(r.stop_at)}</div>
      </div>
      <div class="row-actions" id="actions-${r.bot_id}">
        ${driveHtml}
      </div>
    </div>`;
}

async function autoUpload(botId) {
  try {
    const res = await fetch(`/api/recordings/${botId}/upload`, { method: "POST" });
    const data = await res.json();
    const actEl = document.getElementById("actions-" + botId);
    if (!actEl) return;
    if (res.ok && data.ok && data.drive_link) {
      actEl.innerHTML = `<a class="drive-link" href="${escapeHtml(data.drive_link)}" target="_blank" rel="noopener">📂 Open in Google Drive</a>`;
      if (data.transcript_link) {
        actEl.innerHTML += ` <a style="font-size:12px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;color:var(--muted);text-decoration:none;" href="${escapeHtml(data.transcript_link)}" target="_blank">Transcript</a>`;
      }
    } else {
      // Not ready yet — show a manual retry
      actEl.innerHTML = `<button class="ghost" onclick="autoUpload('${botId}')">↑ Retry Upload</button><span style="color:var(--muted);font-size:12px;margin-left:8px">${data.reason || data.error || "Not ready"}</span>`;
    }
  } catch (err) {
    const actEl = document.getElementById("actions-" + botId);
    if (actEl) actEl.innerHTML = `<button class="ghost" onclick="autoUpload('${botId}')">↑ Retry Upload</button>`;
  }
}

async function cancelBot(botId) {
  if (!confirm("Cancel this scheduled recording?")) return;
  try {
    const res = await fetch(`/api/recordings/${botId}`, { method: "DELETE" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Cancel failed");
    refresh();
  } catch (err) {
    alert(err.message);
  }
}

// Refresh every 30s
refresh();
setInterval(refresh, 30_000);
</script>
</body>
</html>
